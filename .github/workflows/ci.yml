name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      # `build` also runs the conventions lint and the deployability guard, and
      # compiles the preview pages — so a break in any of them fails here
      # rather than at deploy time.
      - name: Build
        run: npm run build
