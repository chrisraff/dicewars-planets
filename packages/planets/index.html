<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Dicewars Planets</title>
    <link rel="stylesheet" href="/src/render/hud.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #f2f2f2;
        -webkit-text-size-adjust: 100%;
      }

      /* 100dvh, so mobile browser chrome sliding in and out doesn't crop the
         canvas or push the controls off the bottom of the screen */
      #planet-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none; /* the canvas handles its own drag-to-orbit */
      }
    </style>
  </head>
  <body>
    <canvas id="planet-canvas"></canvas>
    <div id="hud"></div>
    <div id="menu" hidden></div>
    <div id="explainer" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
